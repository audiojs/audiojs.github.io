  <div class="stage">
    <canvas tabindex="0" aria-label="A signal through a window, filled with a gradient from the axis to the waveform's edge. Drag it sideways to turn it, let go to fling it; tap it, or press Space, for the next signal; the arrows nudge it."></canvas>
    <p class="fail" id="fail" hidden>This page needs WebGL 2.</p>
  </div>

  <form class="bar" id="controls">
    <div class="grid">
      <div class="group" role="group" aria-label="Visual">
        <div class="pairs">
          <div class="pair"><label for="signal">Signal</label><select id="signal" name="signal"><button><selectedcontent></selectedcontent></button></select></div>
          <div class="pair"><label for="window">Window</label><select id="window" name="window"><button><selectedcontent></selectedcontent></button></select></div>
          <div class="pair"><label for="cycles">Cycles</label><span class="slider"><input type="range" id="cycles" name="cycles" min="0.5" max="8" step="0.5" value="1"><output id="cycles-out">1</output></span></div>
          <div class="pair"><label for="gradient">Gradient</label><select id="gradient" name="gradient"><button><selectedcontent></selectedcontent></button></select></div>
          <div class="pair"><label for="print">Print</label><select id="print" name="print"><button><selectedcontent></selectedcontent></button></select></div>
          <div class="pair"><label for="size">Size</label><span class="slider"><input type="range" id="size" name="size" min="0.5" max="8" step="0.5" value="2"><output id="size-out">2 px</output></span></div>
          <div class="pair"><label for="gap">Gap</label><span class="slider"><input type="range" id="gap" name="gap" min="0" max="24" step="0.5" value="6"><output id="gap-out">6 px</output></span></div>
          <div class="pair"><label for="invert">Invert</label><span class="slider"><button type="button" class="toggle" id="invert" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button></span></div>
        </div>
      </div>
      <div class="group" role="group" aria-label="Motion">
        <div class="pairs">
          <div class="pair"><label for="speed">Speed</label><span class="slider"><input type="range" id="speed" name="speed" min="-2" max="2" step="0.05" value="0.25"><output id="speed-out">0.25 Hz</output></span></div>
          <div class="pair"><label for="hover">Hover</label><select id="hover" name="hover"><button><selectedcontent></selectedcontent></button></select></div>
          <div class="pair"><label for="lift">Lift</label><select id="lift" name="lift"><button><selectedcontent></selectedcontent></button></select></div>
          <div class="pair"><label for="sound">Sound</label><select id="sound" name="sound"><button><selectedcontent></selectedcontent></button></select></div>
        </div>
      </div>
    </div>
  </form>

  <script type="module">
  import { logo, WINDOWS, SIGNALS, DITHERS, SCREENS, label, drawing } from '/audio/logo/logo.js'
  import { motion, HOVERS, LIFTS, SOUNDS } from '/audio/logo/motion.js'

  const $ = s => document.querySelector(s)
  const root = document.documentElement, canvas = $('.stage canvas'), form = $('#controls'), invert = $('#invert')
  const { signal, window: win, gradient, print, cycles, speed, size, gap, hover, lift, sound } = form.elements
  const view = logo(canvas, { onresize: () => answer?.set({}) })

  // Every picker shows each choice, drawn where it has a shape; print styles are drawn by the logo's own shader
  const offer = (select, names, chosen, draw) => {
    for (const name of names) {
      if (!name) { select.append(document.createElement('hr')); continue }
      const option = new Option('', name)
      option.innerHTML = `${draw?.(name) ?? ''}<span>${label(name)}</span>`
      select.append(option)
    }
    select.value = chosen
  }
  offer(signal, Object.keys(SIGNALS), 'sine', drawing.signal)
  offer(win, WINDOWS, 'hann', drawing.window)
  offer(gradient, WINDOWS, 'bartlett', drawing.gradient)
  offer(print, [...DITHERS, null, ...SCREENS], 'smooth', view && (name => `<span class="icon mask" style="mask-image: url('${view.icon(name)}')"></span>`))
  offer(hover, Object.keys(HOVERS), 'stir')
  offer(lift, LIFTS, 'none')
  offer(sound, SOUNDS, 'none')
  if (!view) $('#fail').hidden = false
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) speed.value = 0

  const answer = view && motion(view, canvas, { favicon: true, ontap: name => { signal.value = name; sync() } })

  function sync() {
    root.classList.toggle('invert', invert.ariaPressed === 'true')
    // Size is a dot, a nib or a line's width; gap, the space between lines and marks, which dithers have none of
    size.disabled = print.value === 'smooth'
    gap.disabled = DITHERS.includes(print.value)
    $('#cycles-out').value = cycles.value
    $('#speed-out').value = `${speed.value.replace('-', '−')} Hz`
    $('#size-out').value = `${size.value} px`
    $('#gap-out').value = `${gap.value} px`
    for (const range of form.querySelectorAll('input[type=range]')) fill(range)
    const css = getComputedStyle(root)
    view?.set({ window: win.value, gradient: gradient.value, print: print.value, size: +size.value, gap: +gap.value, ground: css.getPropertyValue('--ground'), figure: css.getPropertyValue('--figure') })
    answer?.set({ signal: signal.value, speed: +speed.value, cycles: +cycles.value, hover: hover.value, lift: lift.value, sound: sound.value })
  }
  // A slider's fill runs from zero, or from the low end when zero is off the scale, to the value
  function fill(range) {
    const min = +range.min, max = +range.max, at = v => (v - min) / (max - min) * 100
    const zero = at(Math.min(max, Math.max(min, 0))), value = at(+range.value)
    range.style.setProperty('--from', `${Math.min(zero, value)}%`)
    range.style.setProperty('--to', `${Math.max(zero, value)}%`)
  }
  form.addEventListener('input', sync)
  form.addEventListener('submit', e => e.preventDefault())
  invert.addEventListener('click', () => { invert.ariaPressed = String(invert.ariaPressed !== 'true'); sync() })
  sync()
  </script>
